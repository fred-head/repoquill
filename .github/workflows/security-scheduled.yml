name: Scheduled security surveillance

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: scheduled-security
  cancel-in-progress: false

env:
  GO_VERSION: 1.26.x
  NODE_VERSION: "22"
  IMAGE_NAME: ghcr.io/fred-head/repoquill
  LATEST_ALPHA_VERSION: ${{ vars.REPOQUILL_LATEST_ALPHA_VERSION }}

jobs:
  go-security:
    name: Scheduled Go security
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Static analysis
        run: go vet ./...

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0

      - name: Scan Go call graph for known vulnerabilities
        run: govulncheck ./...

  frontend-security:
    name: Scheduled frontend security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Reproducible dependency install
        run: npm ci

      - name: Static analysis
        run: npm run lint

      - name: Scan npm dependency graph
        run: npm audit

  secret-history:
    name: Scheduled repository secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan Git history and working tree
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ github.token }}

  fresh-image:
    name: Scan fresh production image
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build with current base images
        run: >-
          docker build
          --pull
          --build-arg VERSION=scheduled-${GITHUB_SHA}
          --build-arg VCS_REF=${GITHUB_SHA}
          --tag repoquill:scheduled
          .

      - name: Produce Trivy report
        id: trivy
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: repoquill:scheduled
          format: json
          output: trivy-fresh.json
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: Retain fresh-image report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-fresh-${{ github.run_id }}
          path: trivy-fresh.json
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce fresh-image policy
        if: always()
        run: ./scripts/evaluate-trivy-report.sh trivy-fresh.json repoquill:scheduled

  published-images:
    name: Scan published ${{ matrix.kind }} image
    if: ${{ vars.REPOQUILL_LATEST_ALPHA_VERSION != '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: immutable
            tag: ${{ vars.REPOQUILL_LATEST_ALPHA_VERSION }}
          - kind: channel
            tag: 0.1.0-alpha
    steps:
      - name: Check out policy script
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Resolve published digest
        id: image
        run: |
          reference="${IMAGE_NAME}:${{ matrix.tag }}"
          docker pull "${reference}"
          digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "${reference}")"
          echo "reference=${reference}" >> "${GITHUB_OUTPUT}"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          {
            echo "## Published image under test"
            echo
            echo "- Kind: \`${{ matrix.kind }}\`"
            echo "- Tag: \`${reference}\`"
            echo "- Resolved digest: \`${digest}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Produce Trivy report
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.reference }}
          format: json
          output: trivy-published-${{ matrix.kind }}.json
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: Retain published-image report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-published-${{ matrix.kind }}-${{ github.run_id }}
          path: trivy-published-${{ matrix.kind }}.json
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce published-image policy
        if: always()
        run: >-
          ./scripts/evaluate-trivy-report.sh
          trivy-published-${{ matrix.kind }}.json
          "${{ steps.image.outputs.digest || steps.image.outputs.reference }}"
