name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: 1.26.x
  NODE_VERSION: "22"
  RELEASE_VERSION: 0.1.0-alpha.1

jobs:
  backend:
    name: Backend and Go security
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Unit and integration tests
        run: go test ./...

      - name: Static analysis
        run: go vet ./...

      - name: Race detector
        run: go test -race ./...

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0

      - name: Go vulnerability scan
        run: govulncheck ./...

  frontend:
    name: Frontend and npm security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Reproducible dependency install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit and component tests
        run: npm test

      - name: Production PWA build
        run: npm run build

      - name: npm vulnerability audit
        run: npm audit

  secrets:
    name: Repository secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan Git history and working tree
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}

  container:
    name: Hardened container release gate
    runs-on: ubuntu-latest
    needs: [backend, frontend, secrets]
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build clean production image
        run: >-
          docker build
          --build-arg VERSION=${RELEASE_VERSION}
          --build-arg VCS_REF=${GITHUB_SHA}
          --tag repoquill:ci
          .

      - name: Scan image vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: repoquill:ci
          format: table
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Smoke-test security and persistence
        run: ./scripts/ci-container-check.sh repoquill:ci "${RELEASE_VERSION}"
