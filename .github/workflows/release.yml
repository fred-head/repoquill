name: Publish alpha container

on:
  push:
    tags:
      - "v*.*.*-alpha.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: 1.26.x
  NODE_VERSION: "22"
  IMAGE_NAME: ghcr.io/fred-head/repoquill

jobs:
  verify:
    name: Verify tagged source
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      channel: ${{ steps.release.outputs.channel }}
      sha_tag: ${{ steps.release.outputs.sha_tag }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Validate release metadata
        id: release
        shell: bash
        run: |
          ./scripts/check-release-version.sh "${GITHUB_REF_NAME}"
          version="${GITHUB_REF_NAME#v}"
          channel="${version%.*}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "channel=${channel}" >> "${GITHUB_OUTPUT}"
          echo "sha_tag=sha-${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Backend tests and analysis
        run: |
          go test ./...
          go vet ./...
          go test -race ./...

      - name: Install and run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...

      - name: Frontend tests, build, and audit
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
          npm audit

  secrets:
    name: Scan tagged Git history
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}

  validate-image:
    name: Validate ${{ matrix.platform }}
    runs-on: ubuntu-latest
    needs: [verify, secrets]
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            slug: amd64
          - platform: linux/arm64
            slug: arm64
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build architecture image for validation
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          tags: repoquill:validate-${{ matrix.slug }}
          build-args: |
            VERSION=${{ needs.verify.outputs.version }}
            VCS_REF=${{ github.sha }}
          provenance: false
          sbom: false

      - name: Scan architecture image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: repoquill:validate-${{ matrix.slug }}
          format: table
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Smoke-test architecture image
        run: >-
          ./scripts/ci-container-check.sh
          repoquill:validate-${{ matrix.slug }}
          "${{ needs.verify.outputs.version }}"

  publish:
    name: Publish multi-architecture image
    runs-on: ubuntu-latest
    needs: [verify, secrets, validate-image]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse an existing immutable version
        shell: bash
        run: |
          ensure_absent() {
            local reference output
            reference="$1"
            if output="$(docker buildx imagetools inspect "${reference}" 2>&1)"; then
              echo "Immutable image reference already exists: ${reference}" >&2
              exit 1
            fi
            if ! grep --ignore-case --extended-regexp 'not found|manifest unknown|no such manifest' <<<"${output}" >/dev/null; then
              echo "Could not safely determine whether ${reference} exists:" >&2
              echo "${output}" >&2
              exit 1
            fi
          }
          ensure_absent "${IMAGE_NAME}:${{ needs.verify.outputs.version }}"
          ensure_absent "${IMAGE_NAME}:${{ needs.verify.outputs.sha_tag }}"

      - name: Build and publish manifest
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ needs.verify.outputs.version }}
            ${{ env.IMAGE_NAME }}:${{ needs.verify.outputs.sha_tag }}
            ${{ env.IMAGE_NAME }}:${{ needs.verify.outputs.channel }}
          build-args: |
            VERSION=${{ needs.verify.outputs.version }}
            VCS_REF=${{ github.sha }}
          provenance: mode=max
          sbom: true

      - name: Verify published aliases and architectures
        shell: bash
        run: |
          version_manifest="${RUNNER_TEMP}/repoquill-version-manifest.json"
          sha_manifest="${RUNNER_TEMP}/repoquill-sha-manifest.json"
          channel_manifest="${RUNNER_TEMP}/repoquill-channel-manifest.json"
          docker buildx imagetools inspect --raw \
            "${IMAGE_NAME}:${{ needs.verify.outputs.version }}" > "${version_manifest}"
          docker buildx imagetools inspect --raw \
            "${IMAGE_NAME}:${{ needs.verify.outputs.sha_tag }}" > "${sha_manifest}"
          docker buildx imagetools inspect --raw \
            "${IMAGE_NAME}:${{ needs.verify.outputs.channel }}" > "${channel_manifest}"
          cmp "${version_manifest}" "${sha_manifest}"
          cmp "${version_manifest}" "${channel_manifest}"
          node - "${version_manifest}" <<'NODE'
          const fs = require('node:fs')
          const manifest = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'))
          const platforms = new Set(
            (manifest.manifests ?? [])
              .map((entry) => `${entry.platform?.os}/${entry.platform?.architecture}`)
          )
          for (const expected of ['linux/amd64', 'linux/arm64']) {
            if (!platforms.has(expected)) {
              console.error(`Published manifest is missing ${expected}`)
              process.exit(1)
            }
          }
          NODE

      - name: Create signed GitHub attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          subject-version: ${{ needs.verify.outputs.version }}
          push-to-registry: true

      - name: Summarize published image
        shell: bash
        run: |
          {
            echo "## Published RepoQuill alpha"
            echo
            echo "- Image: \`${IMAGE_NAME}\`"
            echo "- Version: \`${{ needs.verify.outputs.version }}\`"
            echo "- Channel: \`${{ needs.verify.outputs.channel }}\`"
            echo "- Git tag: \`${GITHUB_REF_NAME}\`"
            echo "- Architectures: \`linux/amd64\`, \`linux/arm64\`"
            echo "- Digest: \`${{ steps.push.outputs.digest }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
